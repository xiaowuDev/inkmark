[package]
name = "inkmark"
version = "0.1.0"
description = "A fast, local-first Markdown editor for macOS"
authors = ["Zhuanz"]
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inkmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eventsource-stream = "0.2"
futures-util = "0.3"
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-process = "2"
walkdir = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView"] }
